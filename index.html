<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="gameContainer">
    <h1 id="gameName">Game of Ayla & Adem</h1>
    <canvas id="gameBoard" width="360" height="360"></canvas>
    <div id="scoreText">0</div>
    <button id="resetBtn">Reset</button>

    <!-- 👇 Mobil yön butonları -->
    <div id="controls">
      <div class="row">
        <button class="control-btn" data-dir="UP">↑</button>
      </div>
      <div class="row">
        <button class="control-btn" data-dir="LEFT">←</button>
        <button class="control-btn" data-dir="DOWN">↓</button>
        <button class="control-btn" data-dir="RIGHT">→</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
